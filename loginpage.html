<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto-FullStack</title>
    <link rel="stylesheet" href="./src/css/loginpage.css">
</head>
<body>
    <header>
        <nav>

        </nav>
    </header>
    <main>
        <div id="card">
            <form method="get" id="Registro">
                <h1>Register</h1>
                <div class="campo">
                    <label for="nome">Nome:</label>
                    <input 
                    type="text"
                    id="nome"
                    name="nome">
                </div>
                <div class="campo">
                    <label for="email">Email:</label>
                    <input 
                    type="email"
                    id="email"
                    name="email">
                </div>
                <div class="campo">
                    <label for="password">Senha:</label>
                    <input 
                    type="password"
                    id="password"
                    name="password">
                </div>
                <div class="campo">
                    <label for="confirm-password">Confirmar senha:</label>
                    <input 
                    type="password"
                    id="confirm-password"
                    name="confirm-password">
                </div>
                <div id="button-area">
                    <button type="submit" form="Registro">Registrar</button>
                </div>
                
            </form>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
